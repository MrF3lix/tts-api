[project]
name = "tts-ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Felix Saaro", email = "saaf@zhaw.ch" }
]
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.8",
    "librosa>=0.11.0",
    "omegaconf>=2.3.1",
    "rootutils>=1.0.7",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
modern = [
    "gradio>=6.31.0",
    "transformers>=5.21.1",
]
legacy = [
    "gradio>=5,<6",
    "transformers>=4.33,<4.61",
    "tts==0.22.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
]

[tool.uv]
conflicts = [
    [{ extra = "modern" }, { extra = "legacy" }],
]
override-dependencies = [
    "pandas>=2",
]


[project.scripts]
tts-ui = "tts_ui:main"
tts-ui-legacy = "tts_ui.legacy:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
