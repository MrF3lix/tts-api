[project]
name = "tts-ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Felix Saaro", email = "saaf@zhaw.ch" }
]
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.8",
    "librosa>=0.11.0",
    "omegaconf>=2.3.1",
    "rootutils>=1.0.7",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
modern = [
    "gradio>=6.31.0",
    "transformers>=5.21.1",
]
legacy = [
    "gradio>=5,<6",
    "transformers>=4.33,<4.61",
    "tts==0.22.0",
    # pinned on macOS only; on Linux/Windows the backend extra (cu*/rocm) picks torch
    "torch==2.5.1; sys_platform == 'darwin'",
    "torchaudio==2.5.1; sys_platform == 'darwin'",
]
cu126 = ["torch==2.8.0; sys_platform != 'darwin'"]
cu128 = ["torch==2.8.0; sys_platform != 'darwin'"]
cu132 = ["torch==2.15.0; sys_platform != 'darwin'"]
rocm = [
    "torch==2.11.0; sys_platform != 'darwin'",
    "triton-rocm; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[tool.uv]
conflicts = [
    [{ extra = "modern" }, { extra = "legacy" }],
    [{ extra = "cu126" }, { extra = "cu128" }, { extra = "cu132" }, { extra = "rocm" }],
]
override-dependencies = [
    "pandas>=2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu132", extra = "cu132", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform != 'darwin'" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true


[project.scripts]
tts-ui = "tts_ui:main"
tts-ui-legacy = "tts_ui.legacy:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
