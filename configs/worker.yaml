# @package _global_

defaults:
  - _self_
  - paths: default
  # which model this worker serves: model=qwen3_tts_base for Qwen3-TTS
  - model: gpt_xtts_v2


device: auto
redis_url: ${oc.env:REDIS_URL,redis://localhost:6379/0}

worker:
  heartbeat_ttl_seconds: 30
  recovery_interval_seconds: 30
  # a sample whose worker crashed this many times is marked failed instead of retried
  max_deliveries: 3
  speaker_cache_size: 32
