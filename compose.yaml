name: tts-api

x-xtts-worker: &xtts-worker
  build:
    context: .
    args:
      EXTRAS: "--extra legacy --extra api --extra ${TORCH_EXTRA:-cu132}"
  image: tts-api-worker
  restart: unless-stopped
  environment:
    REDIS_URL: redis://redis:6379/0
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  volumes:
    - ./model:/app/model:ro
  depends_on:
    redis:
      condition: service_healthy
  deploy: &xtts-deploy
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-4gb}", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  gateway:
    build:
      context: .
      args:
        EXTRAS: "--extra api"
    image: tts-api-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["tts-api-gateway", "server.host=0.0.0.0", "server.port=8000"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  xtts-e3-s7-worker:
    <<: *xtts-worker
    command: ["tts-api-worker", "model=gpt_xtts_v2_e3-s7", "device=${DEVICE:-cuda}"]
    deploy:
      <<: *xtts-deploy
      replicas: ${XTTS_E3_S7_WORKERS:-1}

  xtts-e6-s7-worker:
    <<: *xtts-worker
    command: ["tts-api-worker", "model=gpt_xtts_v2_e6-s7", "device=${DEVICE:-cuda}"]
    deploy:
      <<: *xtts-deploy
      replicas: ${XTTS_E6_S7_WORKERS:-1}

  qwen-worker:
    build:
      context: .
      args:
        EXTRAS: "--extra qwen --extra api --extra ${TORCH_EXTRA:-cu132}"
    image: tts-api-worker-qwen
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hf-cache:/home/app/.cache/huggingface
    command: ["tts-api-worker", "model=qwen3_tts_base", "device=${DEVICE:-cuda}"]
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: ${QWEN_WORKERS:-1}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  redis-data:
  hf-cache:
